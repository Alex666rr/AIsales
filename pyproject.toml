[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sales-manager-telegram-prototype"
version = "0.1.0"
description = "Test-only Telegram connector prototype for AI Sales Manager."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14,<2",
    "cryptography>=44,<45",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "telethon>=1.44,<2",
    "python-socks[asyncio]>=2.7,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "PyYAML>=6.0,<7",
    "setuptools>=75",
    "wheel>=0.45,<1",
]

[tool.pytest.ini_options]
testpaths = ["services/telegram_connector/tests", "apps/api/tests"]
pythonpath = ["services", "apps/api", "."]

[tool.setuptools.packages.find]
where = ["services", "apps/api"]
include = ["telegram_connector*", "app*"]
namespaces = true
