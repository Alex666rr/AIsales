name: Railway migrations image contract

on:
  pull_request:
  push:

jobs:
  migrations-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ai_sales
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_sales"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: >-
          python -m pytest
          services/telegram_connector/tests/test_railway_bootstrap.py::test_built_migrations_image_contains_bootstrap_script_and_psql
          -q
      - name: Run role bootstrap and Alembic against PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: ai_sales
          PGUSER: postgres
          PGPASSWORD: ci-admin-password
          POSTGRES_OWNER_PASSWORD: ci-owner-password
          POSTGRES_RUNTIME_PASSWORD: ci-runtime-password
        run: >-
          python -m pytest
          services/telegram_connector/tests/test_railway_postgres_integration.py
          -q
