name: Railway migrations image contract

on:
  pull_request:
  push:

jobs:
  migrations-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: >-
          python -m pytest
          services/telegram_connector/tests/test_railway_bootstrap.py::test_built_migrations_image_contains_bootstrap_script_and_psql
          -q
